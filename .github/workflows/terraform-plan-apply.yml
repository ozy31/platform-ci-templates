# Reusable workflow: Terraform plan on pull requests, gated apply on the
# default branch.
#
#   pull_request -> fmt, validate, plan, sticky PR comment with the plan
#   push (default branch) -> plan, upload the binary plan, then apply *that
#   exact plan* in a job bound to a GitHub Environment (configure required
#   reviewers on the environment to get a manual approval gate).
#
# AWS access is via OIDC only. Use separate roles for plan (read-only) and
# apply (write), scoped by the OIDC `sub` claim (pull_request vs environment).
#
# Caller permissions required:
#   contents: read, id-token: write, pull-requests: write
name: terraform-plan-apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module directory.
        type: string
        required: true
      plan-role-arn:
        description: IAM role for `plan` (read-only + state lock).
        type: string
        required: true
      apply-role-arn:
        description: IAM role for `apply`. Defaults to `plan-role-arn`.
        type: string
        default: ""
      aws-region:
        description: AWS region.
        type: string
        default: eu-central-1
      environment:
        description: GitHub Environment that guards apply (add required reviewers there).
        type: string
        default: production
      terraform-version:
        description: Terraform CLI version.
        type: string
        default: 1.17.0
      init-args:
        description: Extra arguments for `terraform init`, e.g. `-backend-config=env/prod.hcl`.
        type: string
        default: ""
      plan-args:
        description: Extra arguments for `terraform plan`, e.g. `-var-file=env/prod.tfvars`.
        type: string
        default: ""
      apply:
        description: Allow the apply job to run on pushes to the default branch.
        type: boolean
        default: true
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
    outputs:
      has-changes:
        description: "'true' if the plan contains changes."
        value: ${{ jobs.plan.outputs.has-changes }}

permissions: {}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ inputs.working-directory }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write # sticky plan comment
    # Plans may run in parallel, but never against the same root module.
    concurrency:
      group: tf-plan-${{ github.repository }}-${{ inputs.working-directory }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
      artifact: ${{ steps.slug.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Artifact name
        id: slug
        env:
          DIR: ${{ inputs.working-directory }}
        run: |
          slug="${DIR//\//-}"
          echo "artifact=tfplan-${slug#.-}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.plan-role-arn }}
          role-session-name: gha-tf-plan-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        env:
          INIT_ARGS: ${{ inputs.init-args }}
        run: |
          # shellcheck disable=SC2086 # word splitting of INIT_ARGS is intended
          terraform init -lockfile=readonly ${INIT_ARGS}

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        env:
          PLAN_ARGS: ${{ inputs.plan-args }}
        run: |
          set +e
          # shellcheck disable=SC2086 # word splitting of PLAN_ARGS is intended
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan ${PLAN_ARGS}
          rc=$?
          set -e
          case "$rc" in
            0) echo "has-changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has-changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKDIR: ${{ inputs.working-directory }}
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.WORKDIR;
            const marker = `<!-- terraform-plan:${dir} -->`;
            let plan = fs.readFileSync(path.join(dir, 'plan.txt'), 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n\n... truncated, see the workflow logs for the full plan ...';
            }
            const status = process.env.HAS_CHANGES === 'true' ? 'changes detected' : 'no changes';
            const body = [
              marker,
              `#### Terraform plan for \`${dir}\`: ${status}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              `_Run [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for ${context.sha.substring(0, 7)}_`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload plan
        if: github.event_name == 'push' && steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.slug.outputs.artifact }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/.terraform.lock.hcl
          # Plans can contain sensitive values; keep them short-lived.
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply (${{ inputs.working-directory }})
    needs: plan
    if: >-
      inputs.apply &&
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.plan.outputs.has-changes == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    # Never cancel an apply half-way; queue them per root module instead.
    concurrency:
      group: tf-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.apply-role-arn != '' && inputs.apply-role-arn || inputs.plan-role-arn }}
          role-session-name: gha-tf-apply-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Download reviewed plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ inputs.working-directory }}

      - name: terraform init
        env:
          INIT_ARGS: ${{ inputs.init-args }}
        run: |
          # shellcheck disable=SC2086 # word splitting of INIT_ARGS is intended
          terraform init -lockfile=readonly ${INIT_ARGS}

      # Applying the saved plan fails if state drifted since it was created,
      # so what gets applied is exactly what was reviewed.
      - name: terraform apply
        run: terraform apply -no-color -lock-timeout=5m tfplan
