# Reusable workflow: CI for a Node.js service using npm - reproducible
# install, registry signature verification, lint, test and build.
#
# Caller permissions required: contents: read
name: node-service-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing package.json and package-lock.json.
        type: string
        default: "."
      node-version:
        description: Node.js version. Ignored when `.nvmrc`/`.node-version` exists in the working directory.
        type: string
        default: "24"
      ignore-scripts:
        description: Run `npm ci --ignore-scripts` (blocks install-time scripts from dependencies).
        type: boolean
        default: true
      test-command:
        description: npm script used for tests.
        type: string
        default: test
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest

permissions: {}

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node lint & test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Node version
        id: node
        working-directory: .
        env:
          DIR: ${{ inputs.working-directory }}
          DEFAULT: ${{ inputs.node-version }}
        run: |
          for f in "$DIR/.nvmrc" "$DIR/.node-version"; do
            if [[ -f "$f" ]]; then echo "file=$f" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "version=$DEFAULT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          node-version-file: ${{ steps.node.outputs.file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: npm ci
        env:
          IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        run: |
          if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm ci --no-audit --no-fund
          fi

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        env:
          CI: "true"
          TEST_COMMAND: ${{ inputs.test-command }}
        run: npm run "$TEST_COMMAND"

      - name: Build
        run: npm run build --if-present
