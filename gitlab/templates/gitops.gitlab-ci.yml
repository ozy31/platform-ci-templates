# GitOps promotion: bump the image tag in the GitOps repository and open a
# merge request using git push options. Argo CD syncs after merge.
#
# Variables:
#   GITOPS_PROJECT   group/gitops-repo (path on this GitLab instance)
#   GITOPS_TOKEN     (masked) project access token, role Developer, scope write_repository
#   VALUES_FILE      e.g. apps/payments/staging/values.yaml
#   PROMOTE_ENV      environment name, e.g. staging
#   IMAGE_TAG        usually provided by the `.docker:push` dotenv report

.gitops:promote:
  image: alpine:3.22
  stage: promote
  variables:
    GIT_STRATEGY: none
    YQ_VERSION: v4.54.1
    YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
  environment:
    name: $PROMOTE_ENV
  before_script:
    - apk add --no-cache git
    - wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
    - echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
    - chmod +x /usr/local/bin/yq
  script:
    - export BRANCH="promote/${CI_PROJECT_NAME}/${PROMOTE_ENV}/${IMAGE_TAG}"
    - git clone --depth 1 "https://gitlab-ci-token:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${GITOPS_PROJECT}.git" gitops
    - cd gitops
    - yq -i '.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"
    - git checkout -b "$BRANCH"
    - git -c user.name="GitLab CI" -c user.email="ci@noreply.invalid" commit -am "chore(${CI_PROJECT_NAME}): promote ${IMAGE_TAG} to ${PROMOTE_ENV}"
    - >-
      git push origin "$BRANCH"
      -o merge_request.create
      -o merge_request.target=main
      -o merge_request.remove_source_branch
      -o "merge_request.title=Promote ${CI_PROJECT_NAME} ${IMAGE_TAG} to ${PROMOTE_ENV}"
      -o "merge_request.description=Automated promotion from ${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}"
